name: Build and backend smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/backend-websocket-sync]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate backend syntax and import
        run: python -c "import ast; ast.parse(open('backend/main.py', encoding='utf-8').read()); import backend.main; print('Backend import OK')"
